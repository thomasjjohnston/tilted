name: Tilted
options:
  bundleIdPrefix: com.thomasjjohnston
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: true
    CURRENT_PROJECT_VERSION: 8
    MARKETING_VERSION: "1.0.0"

targets:
  Tilted:
    type: application
    platform: iOS
    sources:
      - path: Tilted
        type: group
        excludes:
          - Tilted.entitlements
    entitlements:
      path: Tilted/Tilted.entitlements
      properties:
        aps-environment: production
        com.apple.developer.applesignin:
          - Default
        # Invite links open the app. Host must match InviteLink.hosts and the
        # server's /.well-known/apple-app-site-association.
        com.apple.developer.associated-domains:
          - applinks:tilted-server.fly.dev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasjjohnston.tilted
        CODE_SIGN_ENTITLEMENTS: Tilted/Tilted.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPhone only for the App Store launch.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Tilted
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          # Plain-http to a laptop on the LAN (docs/LOCAL-TESTING.md).
          # Debug only: Release talks HTTPS to Fly and keeps ATS on.
          INFOPLIST_KEY_NSAppTransportSecurity_AllowsArbitraryLoads: true
        Release:
          CODE_SIGN_STYLE: Automatic

  TiltedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Tilted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasjjohnston.tilted.tests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tilted.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tilted"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Automatic

schemes:
  Tilted:
    build:
      targets:
        Tilted: all
        TiltedTests: [test]
    test:
      targets:
        - TiltedTests
    run:
      config: Debug
    archive:
      config: Release
