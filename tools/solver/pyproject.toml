[project]
name = "tilted-solver"
version = "0.1.0"
description = "Tilted recommendation engine: advisor, Solver Lab, self-play, training runner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13.7",
]

[project.scripts]
solver = "tilted_solver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tilted_solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
